<script>
// Çıktı formatı "Topraklama Ölçümü Pano Listesi" örnek dosyasıyla birebir uyumlu.
const HEADERS = ["Bölüm","İşletme","Lokasyon","Pano Numarası","Sap Numarası","Sayfa Numarası","Pano Adı","Marka","Şalter/Sigorta Kodu","Şalter Akımı","Kaçak Akım Koruma","Malzeme Kodu","Anma Açma Kaçak Akımı (mA)","Kısa Devre Akımı","Kaçak Akım Açma Süresi (ms)","Kaçak Akım Açma Akımı (mA)","Re (Ω)"];
const FIELD_KEYS = ["bolum","isletme","lokasyon","pano_numarasi","sap_numarasi","sayfa_numarasi","pano_adi","marka","salter_sigorta_kodu","salter_akimi","kacak_akim_koruma","malzeme_kodu","anma_acma_kacak_akimi","kisa_devre_akimi","kacak_akim_acma_suresi","kacak_akim_acma_akimi","re_ohm"];

const PROMPT = `Bu, elektrik pano kayıt defterinden bir sayfanın fotoğrafıdır (el yazısı Türkçe notlar).
Sayfada birden fazla pano/şalter kaydı olabilir; HER BİRİ İÇİN AYRI bir kayıt (satır) oluştur.

Her kayıt için şu alanları çıkar (bilgi yoksa boş string "" bırak, uydurma):
- bolum: sayfadaki bölüm/alan başlığı (örn. "Kazan Dairesi"). Sayfada böyle bir bölüm başlığı yoksa "" bırak.
- isletme, lokasyon, pano_numarasi, sap_numarasi, sayfa_numarasi
- pano_adi: SADECE panonun kendi adı/etiketi. Marka veya model kodunu ASLA pano_adi içine ekleme, onlar ayrı alanlara (marka, salter_sigorta_kodu) yazılacak.
- marka
- salter_sigorta_kodu: şalter/sigorta model kodu. EĞER not "bıçaklı sigorta" ise veya sadece bıçaklı sigortadan bahsediyorsa bu alanı boş "" bırak, bıçaklı sigortayla ilgili hiçbir bilgi yazma.
- salter_akimi: SADECE SAYI yaz, birim ekleme (ör. "25A" değil "25" yaz).
- kacak_akim_koruma: "Var", "Yok" ya da tür ise ("KAKR", "Toroid" vb.) onu yaz; bilgi yoksa "".
- malzeme_kodu, anma_acma_kacak_akimi (SADECE SAYI, mA), kisa_devre_akimi (SADECE SAYI, birim ekleme, ör. "63A" değil "63"), kacak_akim_acma_suresi (SADECE SAYI, ms), kacak_akim_acma_akimi (SADECE SAYI, mA)
- re_ohm: topraklama direnç değeri, SADECE SAYI yaz, "Ω" veya "ohm" ekleme (ör. "0.21Ω" değil "0.21" yaz).

ÖNEMLİ - "X ile aynı" notu: Bir kayıtta "Pano 2 ile aynı", "2062 Kalıp 1 ile aynı" gibi bir ibare varsa, bu alanları uydurmadan aynen şu formatta pano_adi alanına yaz: "AYNI:<referans edilen pano adı veya numarası>" (örn. "AYNI:Pano 2" veya "AYNI:2062 Kalıp 1 PLC Panosu"). Diğer alanları boş bırak; bu kayıtlar daha sonra ilgili panonun bilgileriyle otomatik dolduruluyor.

SADECE geçerli bir JSON listesi döndür, başka hiçbir açıklama/metin/markdown fence ekleme:
[{"bolum": "...", "isletme": "...", "lokasyon": "...", "pano_numarasi": "...", "sap_numarasi": "...", "sayfa_numarasi": "...", "pano_adi": "...", "marka": "...", "salter_sigorta_kodu": "...", "salter_akimi": "...", "kacak_akim_koruma": "...", "malzeme_kodu": "...", "anma_acma_kacak_akimi": "...", "kisa_devre_akimi": "...", "kacak_akim_acma_suresi": "...", "kacak_akim_acma_akimi": "...", "re_ohm": "..."}]`;

// Değer içinden birimleri (A, mA, ms, Ω/ohm) temizleyip sadece sayısal kısmı bırakır.
// Model talimata uymazsa ikinci bir güvence katmanı olarak kullanılır.
function stripUnit(val) {
  if (val === null || val === undefined) return '';
  let s = val.toString().trim();
  if (!s || s === '-') return s;
  s = s.replace(/\s*(mA|ms|Ω|ohm|A)\s*$/i, '').trim();
  return s;
}

const UNIT_FIELDS = ["salter_akimi","anma_acma_kacak_akimi","kisa_devre_akimi","kacak_akim_acma_suresi","kacak_akim_acma_akimi","re_ohm"];

function cleanRecord(rec) {
  const out = { ...rec };
  UNIT_FIELDS.forEach(k => { out[k] = stripUnit(out[k]); });
  return out;
}

// "AYNI:<referans>" olarak işaretlenmiş kayıtları, adı/numarası eşleşen
// gerçek kayıttan (referans hariç) alanlarını kopyalayarak doldurur.
function resolveSameAsReferences(records) {
  const sameRe = /^AYNI:\s*(.+)$/i;
  const isReal = (r) => r.pano_adi && !sameRe.test(r.pano_adi);
  const norm = (s) => (s || '').toString().toLowerCase().replace(/[^a-z0-9ığüşöç]/gi, '');

  return records.map(rec => {
    const m = (rec.pano_adi || '').toString().match(sameRe);
    if (!m) return rec;
    const ref = norm(m[1]);
    const match = records.find(r => isReal(r) && (
      norm(r.pano_adi).includes(ref) || ref.includes(norm(r.pano_adi)) ||
      norm(r.pano_numarasi) === ref || norm(r.sap_numarasi) === ref
    ));
    if (!match) {
      log(`UYARI: "${m[1]}" için eşleşen pano bulunamadı, kayıt referans metniyle bırakıldı.`);
      return rec;
    }
    // Kendi kimlik bilgilerini (bölüm/işletme/lokasyon/pano no/sap no/sayfa no) koru,
    // geri kalan teknik alanları eşleşen panodan kopyala.
    const copied = { ...match };
    ["bolum","isletme","lokasyon","pano_numarasi","sap_numarasi","sayfa_numarasi"].forEach(k => {
      copied[k] = rec[k] || match[k] || '';
    });
    copied.pano_adi = match.pano_adi;
    return copied;
  });
}

// Kullanıcının girdiği İşletme/Lokasyon değerini, alanı boş olan kayıtlara uygular.
function applyDefaults(records) {
  const isletmeVal = isletmeInput.value.trim();
  const lokasyonVal = lokasyonInput.value.trim();
  return records.map(r => ({
    ...r,
    isletme: r.isletme || isletmeVal,
    lokasyon: r.lokasyon || lokasyonVal
  }));
}

// Pano Numarası boş olan kayıtlara, mevcut en büyük sayısal numaradan devam
// ederek sırayla numara verir (referans dosyadaki gibi 1,2,3...).
function autoNumberPanos(records) {
  let maxNum = 0;
  records.forEach(r => {
    const n = parseInt(r.pano_numarasi, 10);
    if (!isNaN(n) && n > maxNum) maxNum = n;
  });
  return records.map(r => {
    if (r.pano_numarasi && r.pano_numarasi.toString().trim()) return r;
    maxNum += 1;
    return { ...r, pano_numarasi: maxNum.toString() };
  });
}

// Referans dosyadaki gibi: aynı grup içinde ardışık aynı İşletme/Lokasyon
// değerleri sadece grubun ilk satırında gösterilir, sonrakiler boş bırakılır.
function collapseRepeatedGroups(records, key) {
  let last = null;
  return records.map(r => {
    const val = (r[key] || '').toString();
    if (val && val === last) {
      return { ...r, [key]: '' };
    }
    if (val) last = val;
    return r;
  });
}

let files = [];
let allRecords = [];

const fileInput = document.getElementById('fileInput');
const thumbs = document.getElementById('thumbs');
const logEl = document.getElementById('log');
const progressEl = document.getElementById('progress');
const processBtn = document.getElementById('processBtn');
const downloadBtn = document.getElementById('downloadBtn');
const resultCard = document.getElementById('resultCard');
const resultTable = document.getElementById('resultTable');
const recCount = document.getElementById('recCount');
const apiKeyInput = document.getElementById('apiKeyInput');
const keyStatus = document.getElementById('keyStatus');
const isletmeInput = document.getElementById('isletmeInput');
const lokasyonInput = document.getElementById('lokasyonInput');

function log(msg) {
  logEl.textContent += msg + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}

// API key'i sadece bu cihazda (localStorage) sakla
const savedKey = localStorage.getItem('gemini_api_key');
if (savedKey) {
  apiKeyInput.value = savedKey;
  keyStatus.textContent = 'Kayıtlı key yüklendi (bu cihazda saklı).';
}

  keyStatus.textContent = apiKeyInput.value.trim() ? 'Key kaydedildi (bu cihazda saklı).' : '';
});

document.getElementById('testKeyBtn').addEventListener('click', async () => {
  const apiKey = apiKeyInput.value.trim();
  if (!apiKey) { keyStatus.textContent = 'Önce key gir.'; return; }
  keyStatus.textContent = 'Test ediliyor...';
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}`);
    const data = await res.json();
    if (!res.ok) {

      keyStatus.textContent = `❌ Key/erişim hatası: ${msg}`;
      log(`Bağlantı testi başarısız: ${msg}`);
    } else {
      const count = (data.models || []).length;
      keyStatus.textContent = `✅ Bağlantı çalışıyor (${count} model görünür). Sorun görselle/ağla ilgili olabilir.`;
      log(`Bağlantı testi başarılı, ${count} model listelendi.`);
    }
  } catch (e) {
    keyStatus.textContent = `❌ Ağ hatası: ${e.message} — bu genelde CORS/ağ engeli veya key sorunu demek.`;
    log(`Bağlantı testi ağ hatası: ${e.message}`);
  }
});

fileInput.addEventListener('change', () => {
  files = Array.from(fileInput.files);
  thumbs.innerHTML = '';
  files.forEach(f => {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    thumbs.appendChild(img);

});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// WhatsApp fotoğrafları çok büyük olabiliyor (birkaç MB); göndermeden önce
// makul bir boyuta küçültüp JPEG'e sıkıştırıyoruz. Bu hem yüklemeyi hızlandırır
// hem de "sonsuza kadar işleniyor" görünmesini engeller.
function resizeImageToBase64(file, maxDim = 1600, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) {
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else {
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      resolve(dataUrl.split(',')[1]);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('Görsel okunamadı.'));
    };
    img.src = url;
  });
}

const MODEL_CHAIN = ['gemini-flash-latest', 'gemini-flash-lite-latest', 'gemini-2.0-flash']; // meşgulse sırayla dener

async function extractFromImage(file, apiKey, attempt = 1, modelIdx = 0) {
  const base64 = await resizeImageToBase64(file);
  const mediaType = 'image/jpeg'; // resizeImageToBase64 her zaman JPEG üretir
  const model = MODEL_CHAIN[modelIdx];

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 90000); // 90 sn zaman aşımı

  let response;
  try {
    response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: controller.signal,
        body: JSON.stringify({
          contents: [
            {
              role: "user",
              parts: [
                { inline_data: { mime_type: mediaType, data: base64 } },
                { text: PROMPT }
              ]
            }
          ],
          generationConfig: { temperature: 0 }
        })
      }
    );
  } catch (err) {
    clearTimeout(timeoutId);
    const isTimeoutOrNetwork = err.name === 'AbortError' || err.message === 'Failed to fetch';
    if (isTimeoutOrNetwork) {
      if (attempt < 6) {
        const waitMs = Math.min(attempt * 5000, 25000);
        log(`  ${model} yanıt vermedi (zaman aşımı/ağ), ${waitMs/1000} sn sonra tekrar denenecek (deneme ${attempt+1}/6)...`);
        await new Promise(r => setTimeout(r, waitMs));
        return extractFromImage(file, apiKey, attempt + 1, modelIdx);
      }
      if (modelIdx < MODEL_CHAIN.length - 1) {
        log(`  ${model} hâlâ yanıt vermiyor, sıradaki model deneniyor: ${MODEL_CHAIN[modelIdx + 1]}`);
        return extractFromImage(file, apiKey, 1, modelIdx + 1);
      }
      throw new Error('Zaman aşımı: birkaç denemeden sonra yanıt gelmedi (yavaş/kararsız bağlantı olabilir).');
    }
    throw err;
  }
  clearTimeout(timeoutId);

  const data = await response.json();

  // Model geçici olarak yoğunsa (503/overloaded) ya da rate-limit'e (429) takıldıysa:
  // önce aynı modeli birkaç kez bekleyip dener, olmazsa sıradaki modele geçer.
  const isRateLimited = !response.ok && response.status === 429;
  const isOverloaded = !response.ok && (
    response.status === 503 ||
    (data && data.error && /overloaded|unavailable/i.test(data.error.status || data.error.message || ''))
  );

  if ((isOverloaded || isRateLimited) && attempt < 6) {
    const waitMs = Math.min(attempt * 5000, 25000); // 5,10,15,20,25 sn
    log(`  ${model} meşgul/limitli, ${waitMs/1000} sn sonra tekrar denenecek (deneme ${attempt+1}/6)...`);
    await new Promise(r => setTimeout(r, waitMs));
    return extractFromImage(file, apiKey, attempt + 1, modelIdx);
  }
  if ((isOverloaded || isRateLimited) && modelIdx < MODEL_CHAIN.length - 1) {
    log(`  ${model} hâlâ meşgul, sıradaki model deneniyor: ${MODEL_CHAIN[modelIdx + 1]}`);
    return extractFromImage(file, apiKey, 1, modelIdx + 1);
  }

  if (!response.ok) {
    const msg = (data && data.error && data.error.message) ? data.error.message : `HTTP ${response.status}`;
    throw new Error(msg);
  }

  const candidate = data.candidates && data.candidates[0];
  const parts = candidate && candidate.content && candidate.content.parts || [];
  let raw = parts.map(p => p.text || '').join("\n").trim();
  raw = raw.replace(/```json/g, "").replace(/```/g, "").trim();

  if (!raw) {
    const blockReason = data.promptFeedback && data.promptFeedback.blockReason;
    const finishReason = candidate && candidate.finishReason;
    if (blockReason) throw new Error(`Google bu görseli reddetti: ${blockReason}`);
    if (finishReason && finishReason !== 'STOP') throw new Error(`Model yanıt üretemedi (finishReason: ${finishReason})`);
    throw new Error('Model boş yanıt döndürdü.');
  }

  try {
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [parsed];
  } catch (e) {
    log(`UYARI: ${file.name} için JSON parse edilemedi.`);
    log(raw.slice(0, 300));
    return [];
  }
}

function renderTable() {
  let html = '<tr>' + HEADERS.map(h => `<th>${h}</th>`).join('') + '</tr>';
  allRecords.forEach(rec => {
    html += '<tr>' + FIELD_KEYS.map(k => `<td>${(rec[k] || '').toString().replace(/</g,'&lt;')}</td>`).join('') + '</tr>';
  });
  resultTable.innerHTML = html;
  recCount.textContent = allRecords.length;
  resultCard.style.display = allRecords.length ? 'block' : 'none';
}

processBtn.addEventListener('click', async () => {
  const apiKey = apiKeyInput.value.trim();
  if (!apiKey) { log('Önce yukarıya Gemini API key\'ini gir.'); return; }
  if (!files.length) { log('Önce fotoğraf seç.'); return; }
  processBtn.disabled = true;
  allRecords = [];
  logEl.textContent = '';

  const CONCURRENCY = 2; // ücretsiz katmanın dakikalık limiti düşük; fazla paralellik kendi rate-limit'ini tetikliyor
  let done = 0;
  let nextIndex = 0;

  async function worker() {
    while (nextIndex < files.length) {
      const i = nextIndex++;
      const f = files[i];
      log(`İşleniyor: ${f.name}`);
      try {
        const records = (await extractFromImage(f, apiKey)).map(cleanRecord);
        allRecords = allRecords.concat(records);
        log(`  -> ${f.name}: ${records.length} kayıt bulundu`);
      } catch (e) {
        log(`HATA: ${f.name} işlenirken sorun oluştu -> ${e.message}`);
      }
      done++;
      progressEl.textContent = `İşleniyor: ${done}/${files.length} tamamlandı`;
      renderTable();
    }
  }

  const workerCount = Math.min(CONCURRENCY, files.length);
  await Promise.all(Array.from({ length: workerCount }, () => worker()));

  allRecords = resolveSameAsReferences(allRecords);
  allRecords = applyDefaults(allRecords);
  allRecords = autoNumberPanos(allRecords);
  renderTable();

  progressEl.textContent = `Tamamlandı. Toplam ${allRecords.length} kayıt.`;
  log(`\nToplam ${allRecords.length} kayıt çıkarıldı.`);
  processBtn.disabled = false;
  downloadBtn.disabled = allRecords.length === 0;
});

const COL_WIDTHS = [14,12,16,12,12,12,34,14,20,12,16,14,16,12,16,16,10];

downloadBtn.addEventListener('click', async () => {
  // Sadece indirilecek dosya için: aynı İşletme/Lokasyon tekrarlarını referans
  // dosyadaki gibi grubun ilk satırında bırakıp sonrakileri boşaltıyoruz.
  let exportRecords = collapseRepeatedGroups(allRecords, 'isletme');
  exportRecords = collapseRepeatedGroups(exportRecords, 'lokasyon');

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("Pano Kayıtları");
  ws.columns = HEADERS.map((h, i) => ({ header: h, key: FIELD_KEYS[i], width: COL_WIDTHS[i] }));

  exportRecords.forEach(rec => {
    ws.addRow(FIELD_KEYS.map(k => rec[k] || ''));
  });

  const thinBorder = { style: 'thin', color: { argb: 'FF999999' } };
  ws.eachRow((row, rowNumber) => {
    row.eachCell({ includeEmpty: true }, (cell) => {
      cell.border = { top: thinBorder, left: thinBorder, bottom: thinBorder, right: thinBorder };
      cell.alignment = { vertical: 'middle', wrapText: rowNumber === 1 };
      if (rowNumber === 1) {
        cell.font = { bold: true, size: 12 };
      }
    });
  });
  ws.views = [{ state: 'frozen', ySplit: 1 }];

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pano_kayitlari_otomatik.xlsx';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  log('Excel dosyası indirildi: pano_kayitlari_otomatik.xlsx (kalın başlık + kenarlıklarla, referans formata uygun)');
});

if ('serviceWorker' in navigator) {
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.update().catch(() => {});
    }).catch(err => console.warn('SW kayıt hatası:', err));
  });
}
</script>
