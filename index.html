<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E78">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pano→Excel">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pano Kayıtları → Excel Otomasyonu (Gemini)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; background:#f5f5f5; color:#222; }
  h1 { font-size: 20px; }
  .card { background:#fff; border:1px solid #ddd; border-radius:10px; padding:20px; margin-bottom:20px; }
  label { display:block; font-size:13px; font-weight:bold; margin-bottom:6px; }
  input[type=text], input[type=password] { width:100%; padding:8px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; }
  input[type=file] { margin-top:6px; }
  button { background:#1F4E78; color:#fff; border:none; padding:10px 18px; border-radius:6px; cursor:pointer; font-size:14px; }
  button:disabled { background:#999; cursor:not-allowed; }
  button.secondary { background:#666; }
  #thumbs { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  #thumbs img { width:70px; height:70px; object-fit:cover; border-radius:6px; border:1px solid #ccc; }
  #log { font-family:monospace; font-size:12px; background:#111; color:#0f0; padding:12px; border-radius:8px; height:220px; overflow-y:auto; white-space:pre-wrap; }
  table { border-collapse:collapse; width:100%; font-size:12px; margin-top:14px; }
  th, td { border:1px solid #ccc; padding:4px 6px; text-align:left; }
  th { background:#1F4E78; color:#fff; }
  .note { font-size:12px; color:#900; background:#fff3f3; border:1px solid #f0c0c0; padding:10px; border-radius:6px; margin-bottom:16px; }
  .progress { font-size:13px; color:#333; margin-top:8px; }
</style>
</head>
<body>

<h1>⚡ Pano Kayıtları → Excel Otomasyonu (Gemini ile)</h1>

<div class="note">
  Bu uygulama Google Gemini API'yi kullanır. Kendi API key'ini aşağıya gir — key sadece kendi tarayıcında (bu cihazda) saklanır, hiçbir sunucuya gönderilmez, sadece Google'a giden isteklerde kullanılır. Key'ini paylaşma ve kod içine gömme.
</div>

<div class="card">
  <label>0. Gemini API key'in</label>
  <input type="password" id="apiKeyInput" placeholder="AIza... ile başlayan key" />
  <button id="testKeyBtn" class="secondary" style="margin-top:8px;">Bağlantıyı test et</button>
  <div class="progress" id="keyStatus"></div>
</div>

<div class="card">
  <label>1. Pano/sayfa fotoğraflarını yükle (birden fazla seçebilirsin)</label>
  <input type="file" id="fileInput" accept="image/*" multiple capture="environment" />
  <div id="thumbs"></div>
</div>

<div class="card">
  <button id="processBtn">Fotoğrafları işle</button>
  <button id="downloadBtn" class="secondary" disabled>Excel indir</button>
  <div class="progress" id="progress"></div>
</div>

<div class="card">
  <label>İşlem günlüğü</label>
  <div id="log"></div>
</div>

<div class="card" id="resultCard" style="display:none;">
  <label>Çıkarılan kayıtlar (<span id="recCount">0</span>)</label>
  <div style="overflow-x:auto;">
    <table id="resultTable"></table>
  </div>
</div>

<script>
const HEADERS = ["Saç No","Sayfa No","Pano Adı","Marka","Şalter/Sigorta Kodu","Şalter Akımı (A)","Kaçak Akım (Var/Yok)","Malzeme Kodu","Anma Açma Kaçak Akımı","Kısa Devre Akımı (A)","Direnç (Ω)","Kaçak Akım Açma Süresi","Kaçak Akım Açma Akımı"];
const FIELD_KEYS = ["sac_no","sayfa_no","pano_adi","marka","salter_sigorta_kodu","salter_akimi","kacak_akim","malzeme_kodu","anma_acma_kacak_akimi","kisa_devre_akimi","direnc_ohm","kacak_akim_acma_suresi","kacak_akim_acma_akimi"];

const PROMPT = `Bu, elektrik pano kayıt defterinden bir sayfanın fotoğrafıdır (el yazısı Türkçe notlar).
Sayfada birden fazla pano/şalter kaydı olabilir; HER BİRİ İÇİN AYRI bir kayıt (satır) oluştur.

Her kayıt için şu alanları çıkar (bilgi yoksa boş string "" bırak, uydurma):
- sac_no, sayfa_no, pano_adi, marka, salter_sigorta_kodu, salter_akimi, kacak_akim (Var/Yok/""), malzeme_kodu, anma_acma_kacak_akimi, kisa_devre_akimi, direnc_ohm, kacak_akim_acma_suresi, kacak_akim_acma_akimi

SADECE geçerli bir JSON listesi döndür, başka hiçbir açıklama/metin/markdown fence ekleme:
[{"sac_no": "...", "sayfa_no": "...", ...}]`;

let files = [];
let allRecords = [];

const fileInput = document.getElementById('fileInput');
const thumbs = document.getElementById('thumbs');
const logEl = document.getElementById('log');
const progressEl = document.getElementById('progress');
const processBtn = document.getElementById('processBtn');
const downloadBtn = document.getElementById('downloadBtn');
const resultCard = document.getElementById('resultCard');
const resultTable = document.getElementById('resultTable');
const recCount = document.getElementById('recCount');
const apiKeyInput = document.getElementById('apiKeyInput');
const keyStatus = document.getElementById('keyStatus');

function log(msg) {
  logEl.textContent += msg + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}

// API key'i sadece bu cihazda (localStorage) sakla
const savedKey = localStorage.getItem('gemini_api_key');
if (savedKey) {
  apiKeyInput.value = savedKey;
  keyStatus.textContent = 'Kayıtlı key yüklendi (bu cihazda saklı).';
}
apiKeyInput.addEventListener('input', () => {
  localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
  keyStatus.textContent = apiKeyInput.value.trim() ? 'Key kaydedildi (bu cihazda saklı).' : '';
});

document.getElementById('testKeyBtn').addEventListener('click', async () => {
  const apiKey = apiKeyInput.value.trim();
  if (!apiKey) { keyStatus.textContent = 'Önce key gir.'; return; }
  keyStatus.textContent = 'Test ediliyor...';
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}`);
    const data = await res.json();
    if (!res.ok) {
      const msg = (data && data.error && data.error.message) ? data.error.message : `HTTP ${res.status}`;
      keyStatus.textContent = `❌ Key/erişim hatası: ${msg}`;
      log(`Bağlantı testi başarısız: ${msg}`);
    } else {
      const count = (data.models || []).length;
      keyStatus.textContent = `✅ Bağlantı çalışıyor (${count} model görünür). Sorun görselle/ağla ilgili olabilir.`;
      log(`Bağlantı testi başarılı, ${count} model listelendi.`);
    }
  } catch (e) {
    keyStatus.textContent = `❌ Ağ hatası: ${e.message} — bu genelde CORS/ağ engeli veya key sorunu demek.`;
    log(`Bağlantı testi ağ hatası: ${e.message}`);
  }
});

fileInput.addEventListener('change', () => {
  files = Array.from(fileInput.files);
  thumbs.innerHTML = '';
  files.forEach(f => {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    thumbs.appendChild(img);
  });
  log(`${files.length} fotoğraf seçildi.`);
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// WhatsApp fotoğrafları çok büyük olabiliyor (birkaç MB); göndermeden önce
// makul bir boyuta küçültüp JPEG'e sıkıştırıyoruz. Bu hem yüklemeyi hızlandırır
// hem de "sonsuza kadar işleniyor" görünmesini engeller.
function resizeImageToBase64(file, maxDim = 1600, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) {
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else {
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      resolve(dataUrl.split(',')[1]);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('Görsel okunamadı.'));
    };
    img.src = url;
  });
}

const MODEL_CHAIN = ['gemini-flash-latest', 'gemini-flash-lite-latest', 'gemini-2.0-flash']; // meşgulse sırayla dener

async function extractFromImage(file, apiKey, attempt = 1, modelIdx = 0) {
  const base64 = await resizeImageToBase64(file);
  const mediaType = 'image/jpeg'; // resizeImageToBase64 her zaman JPEG üretir
  const model = MODEL_CHAIN[modelIdx];

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 90000); // 90 sn zaman aşımı

  let response;
  try {
    response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: controller.signal,
        body: JSON.stringify({
          contents: [
            {
              role: "user",
              parts: [
                { inline_data: { mime_type: mediaType, data: base64 } },
                { text: PROMPT }
              ]
            }
          ],
          generationConfig: { temperature: 0 }
        })
      }
    );
  } catch (err) {
    clearTimeout(timeoutId);
    const isTimeoutOrNetwork = err.name === 'AbortError' || err.message === 'Failed to fetch';
    if (isTimeoutOrNetwork) {
      if (attempt < 6) {
        const waitMs = Math.min(attempt * 5000, 25000);
        log(`  ${model} yanıt vermedi (zaman aşımı/ağ), ${waitMs/1000} sn sonra tekrar denenecek (deneme ${attempt+1}/6)...`);
        await new Promise(r => setTimeout(r, waitMs));
        return extractFromImage(file, apiKey, attempt + 1, modelIdx);
      }
      if (modelIdx < MODEL_CHAIN.length - 1) {
        log(`  ${model} hâlâ yanıt vermiyor, sıradaki model deneniyor: ${MODEL_CHAIN[modelIdx + 1]}`);
        return extractFromImage(file, apiKey, 1, modelIdx + 1);
      }
      throw new Error('Zaman aşımı: birkaç denemeden sonra yanıt gelmedi (yavaş/kararsız bağlantı olabilir).');
    }
    throw err;
  }
  clearTimeout(timeoutId);

  const data = await response.json();

  // Model geçici olarak yoğunsa (503/overloaded) ya da rate-limit'e (429) takıldıysa:
  // önce aynı modeli birkaç kez bekleyip dener, olmazsa sıradaki modele geçer.
  const isRateLimited = !response.ok && response.status === 429;
  const isOverloaded = !response.ok && (
    response.status === 503 ||
    (data && data.error && /overloaded|unavailable/i.test(data.error.status || data.error.message || ''))
  );

  if ((isOverloaded || isRateLimited) && attempt < 6) {
    const waitMs = Math.min(attempt * 5000, 25000); // 5,10,15,20,25 sn
    log(`  ${model} meşgul/limitli, ${waitMs/1000} sn sonra tekrar denenecek (deneme ${attempt+1}/6)...`);
    await new Promise(r => setTimeout(r, waitMs));
    return extractFromImage(file, apiKey, attempt + 1, modelIdx);
  }
  if ((isOverloaded || isRateLimited) && modelIdx < MODEL_CHAIN.length - 1) {
    log(`  ${model} hâlâ meşgul, sıradaki model deneniyor: ${MODEL_CHAIN[modelIdx + 1]}`);
    return extractFromImage(file, apiKey, 1, modelIdx + 1);
  }

  if (!response.ok) {
    const msg = (data && data.error && data.error.message) ? data.error.message : `HTTP ${response.status}`;
    throw new Error(msg);
  }

  const candidate = data.candidates && data.candidates[0];
  const parts = candidate && candidate.content && candidate.content.parts || [];
  let raw = parts.map(p => p.text || '').join("\n").trim();
  raw = raw.replace(/```json/g, "").replace(/```/g, "").trim();

  if (!raw) {
    const blockReason = data.promptFeedback && data.promptFeedback.blockReason;
    const finishReason = candidate && candidate.finishReason;
    if (blockReason) throw new Error(`Google bu görseli reddetti: ${blockReason}`);
    if (finishReason && finishReason !== 'STOP') throw new Error(`Model yanıt üretemedi (finishReason: ${finishReason})`);
    throw new Error('Model boş yanıt döndürdü.');
  }

  try {
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [parsed];
  } catch (e) {
    log(`UYARI: ${file.name} için JSON parse edilemedi.`);
    log(raw.slice(0, 300));
    return [];
  }
}

function renderTable() {
  let html = '<tr>' + HEADERS.map(h => `<th>${h}</th>`).join('') + '</tr>';
  allRecords.forEach(rec => {
    html += '<tr>' + FIELD_KEYS.map(k => `<td>${(rec[k] || '').toString().replace(/</g,'&lt;')}</td>`).join('') + '</tr>';
  });
  resultTable.innerHTML = html;
  recCount.textContent = allRecords.length;
  resultCard.style.display = allRecords.length ? 'block' : 'none';
}

processBtn.addEventListener('click', async () => {
  const apiKey = apiKeyInput.value.trim();
  if (!apiKey) { log('Önce yukarıya Gemini API key\'ini gir.'); return; }
  if (!files.length) { log('Önce fotoğraf seç.'); return; }
  processBtn.disabled = true;
  allRecords = [];
  logEl.textContent = '';

  const CONCURRENCY = 2; // ücretsiz katmanın dakikalık limiti düşük; fazla paralellik kendi rate-limit'ini tetikliyor
  let done = 0;
  let nextIndex = 0;

  async function worker() {
    while (nextIndex < files.length) {
      const i = nextIndex++;
      const f = files[i];
      log(`İşleniyor: ${f.name}`);
      try {
        const records = await extractFromImage(f, apiKey);
        allRecords = allRecords.concat(records);
        log(`  -> ${f.name}: ${records.length} kayıt bulundu`);
      } catch (e) {
        log(`HATA: ${f.name} işlenirken sorun oluştu -> ${e.message}`);
      }
      done++;
      progressEl.textContent = `İşleniyor: ${done}/${files.length} tamamlandı`;
      renderTable();
    }
  }

  const workerCount = Math.min(CONCURRENCY, files.length);
  await Promise.all(Array.from({ length: workerCount }, () => worker()));

  progressEl.textContent = `Tamamlandı. Toplam ${allRecords.length} kayıt.`;
  log(`\nToplam ${allRecords.length} kayıt çıkarıldı.`);
  processBtn.disabled = false;
  downloadBtn.disabled = allRecords.length === 0;
});

downloadBtn.addEventListener('click', () => {
  const wsData = [HEADERS, ...allRecords.map(rec => FIELD_KEYS.map(k => rec[k] || ''))];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [8,8,34,14,22,14,14,20,20,18,12,20,20].map(w => ({ wch: w }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Pano Kayıtları");
  XLSX.writeFile(wb, "pano_kayitlari_otomatik.xlsx");
  log('Excel dosyası indirildi: pano_kayitlari_otomatik.xlsx');
});

if ('serviceWorker' in navigator) {
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.update().catch(() => {});
    }).catch(err => console.warn('SW kayıt hatası:', err));
  });
}
</script>
</body>
</html>
